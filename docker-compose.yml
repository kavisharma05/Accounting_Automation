services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: accounting
      POSTGRES_PASSWORD: accounting
      POSTGRES_DB: accounting
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U accounting -d accounting"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg2://accounting:accounting@db:5432/accounting
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: dev-secret-change-in-production
      MESSAGING_PROVIDER: mock
      DOCUMENT_PROVIDER: mock
      STORAGE_PROVIDER: local
      LOCAL_STORAGE_PATH: /data/documents
    volumes:
      - document_data:/data/documents
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  worker:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg2://accounting:accounting@db:5432/accounting
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: dev-secret-change-in-production
      MESSAGING_PROVIDER: mock
      DOCUMENT_PROVIDER: mock
      STORAGE_PROVIDER: local
      LOCAL_STORAGE_PATH: /data/documents
    volumes:
      - document_data:/data/documents
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: python -m app.workers.runner

volumes:
  document_data:
