services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: accounting
      POSTGRES_PASSWORD: accounting
      POSTGRES_DB: accounting
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U accounting -d accounting"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg2://accounting:accounting@db:5432/accounting
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: dev-secret-change-in-production
      MESSAGING_PROVIDER: mock
      DOCUMENT_PROVIDER: mock
      STORAGE_PROVIDER: local
      LOCAL_STORAGE_PATH: /data/documents
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      SERVE_FRONTEND: "true"
    volumes:
      - document_data:/data/documents
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: /api/v1
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    depends_on:
      - api

  worker:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg2://accounting:accounting@db:5432/accounting
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: dev-secret-change-in-production
      MESSAGING_PROVIDER: mock
      DOCUMENT_PROVIDER: mock
      STORAGE_PROVIDER: local
      LOCAL_STORAGE_PATH: /data/documents
    volumes:
      - document_data:/data/documents
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: python -m app.workers.runner

  seed:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg2://accounting:accounting@db:5432/accounting
    depends_on:
      db:
        condition: service_healthy
    command: python scripts/seed_pilot_org.py
    profiles:
      - tools

volumes:
  document_data:
