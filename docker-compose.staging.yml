# Staging overlay — use with: docker compose -f docker-compose.yml -f docker-compose.staging.yml up -d
# Copy .env.staging.example to .env.staging and set SECRET_KEY before starting.

services:
  api:
    env_file:
      - .env.staging
    environment:
      ENVIRONMENT: staging
    restart: unless-stopped
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/ready')",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  worker:
    env_file:
      - .env.staging
    restart: unless-stopped

  db:
    restart: unless-stopped

  redis:
    restart: unless-stopped

  seed:
    env_file:
      - .env.staging
