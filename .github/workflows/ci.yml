name: CI

on:
  push:
    branches: [main, "cursor/**"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: accounting
          POSTGRES_PASSWORD: accounting
          POSTGRES_DB: accounting
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U accounting -d accounting"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+psycopg2://accounting:accounting@localhost:5432/accounting
      REDIS_URL: redis://localhost:6379/0
      SECRET_KEY: ci-test-secret-key-with-sufficient-length
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Ruff
        run: ruff check app tests
      - name: Alembic migrate
        run: alembic upgrade head
      - name: Pytest
        run: pytest tests/ -v --cov=app --cov-report=term-missing
      - name: Import app
        run: python -c "from app.main import app; print(app.title)"

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build dashboard
        working-directory: frontend
        run: |
          npm ci
          npm run build

  docker:
    runs-on: ubuntu-latest
    needs: [test, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -t accounting-automation:ci .
